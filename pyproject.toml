[project]
name = "rag-lab"
version = "0.1.0"
description = "Laboratorio educativo para aprender y experimentar con RAG."
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
